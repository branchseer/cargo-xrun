[package]
name = "smbserver"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48", features = ["io-util", "rt"] }

[dev-dependencies]
smb = { version = "0.11", default-features = false, features = ["async", "sign", "encrypt"] }
smb-transport = { version = "0.11", default-features = false, features = ["async"] }
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1.48", features = ["full", "test-util"] }
test-log = { version = "0.2.18", features = ["trace"] }
tracing = "0.1"
